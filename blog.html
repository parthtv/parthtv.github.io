<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>My Blog</h1>
    </header>
    <main>
        <div id="posts"></div>
        <textarea id="new-post" placeholder="Write a new post..."></textarea>
        <button id="submit-post">Submit</button>
    </main>
    <script>
        // GitHub API integration
        const GITHUB_API_URL = 'https://api.github.com/repos/parthtv/parthtv.github.io/contents/posts/';
        const TOKEN = 'YOUR_PERSONAL_ACCESS_TOKEN'; // Replace with your GitHub token

        // Function to fetch posts from GitHub
        async function fetchPosts() {
            const response = await fetch(GITHUB_API_URL, { headers: { 'Authorization': `token ${TOKEN}` } });
            const posts = await response.json();
            const postsContainer = document.getElementById('posts');
            postsContainer.innerHTML = '';
            posts.forEach(post => {
                const postElement = document.createElement('div');
                postElement.innerHTML = `<h2>${post.name.replace('.json', '')}</h2><p>${post.content}</p>`;
                postsContainer.appendChild(postElement);
            });
        }

        // Function to submit a new post
        async function submitPost() {
            const newPostContent = document.getElementById('new-post').value;
            const postTitle = `Post-${Date.now()}.json`;
            const response = await fetch(GITHUB_API_URL + postTitle, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${TOKEN}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: 'New post added',
                    content: btoa(newPostContent),
                    branch: 'main'
                })
            });
            if (response.ok) {
                fetchPosts();
                document.getElementById('new-post').value = '';
            } else {
                console.error('Error submitting post:', response.statusText);
            }
        }

        document.getElementById('submit-post').addEventListener('click', submitPost);

        // Initial fetch of posts
        fetchPosts();
    </script>
</body>
</html>
