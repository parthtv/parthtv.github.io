<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Parth Vaishnav</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #00274C;
    --maize:  #FFCB05;
    --red:    #9A3324;
    --blue:   #2F65A7;
    --bg:     #f9f8f5;
    --white:  #ffffff;
    --text:   #2c2c2c;
    --muted:  #6b7280;
    --border: #e2e8f0;
    --sidebar-w: 280px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    padding: 0 40px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 200;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    flex-shrink: 0;
  }

  .site-name {
    font-family: 'Playfair Display', serif;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
  }

  .header-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    margin-left: 28px;
    transition: color 0.15s;
  }
  .header-links a:hover { color: var(--maize); }

  /* ── LAYOUT ── */
  .blog-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 60px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--white);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .sidebar-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
  }

  .btn-new {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    font-family: 'Source Sans 3', sans-serif;
  }
  .btn-new:hover { background: #003870; }

  .post-list {
    overflow-y: auto;
    flex: 1;
    padding: 10px 0;
  }

  /* ── YEAR / MONTH GROUPS ── */
  .year-group { }

  .year-heading {
    padding: 10px 20px 4px;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.03em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  .year-heading:hover { color: var(--blue); }

  .year-toggle { font-size: 10px; color: var(--muted); transition: transform 0.15s; }
  .year-group.collapsed .year-toggle { transform: rotate(-90deg); }
  .year-group.collapsed .year-body { display: none; }

  .month-group { margin-bottom: 2px; }

  .month-heading {
    padding: 5px 20px 3px 28px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  .month-heading:hover { color: var(--navy); }

  .month-toggle { font-size: 9px; transition: transform 0.15s; }
  .month-group.collapsed .month-toggle { transform: rotate(-90deg); }
  .month-group.collapsed .month-body { display: none; }

  .post-item {
    padding: 9px 20px 9px 32px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    border-bottom: 1px solid var(--border);
  }

  .post-item:last-child { border-bottom: none; }

  .post-item:hover {
    background: #f3f6fb;
    border-left-color: var(--blue);
  }

  .post-item.active {
    background: #eef2fa;
    border-left-color: var(--navy);
  }

  .post-item-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--navy);
    margin-bottom: 2px;
    line-height: 1.4;
  }

  .post-item-date {
    font-size: 11.5px;
    color: var(--muted);
  }

  .post-item-excerpt {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.8;
  }

  /* ── MAIN PANEL ── */
  .main-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--white);
  }

  /* ── READING VIEW ── */
  .reading-view {
    flex: 1;
    overflow-y: auto;
    padding: 48px 60px;
    display: none;
  }

  .reading-view.visible { display: block; }

  .reading-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .reading-date {
    font-size: 13px;
    color: var(--red);
    font-weight: 600;
  }

  .reading-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  .btn-action {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Source Sans 3', sans-serif;
    color: var(--text);
  }
  .btn-action:hover { border-color: var(--navy); color: var(--navy); }
  .btn-action.danger:hover { border-color: var(--red); color: var(--red); }

  .reading-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.2;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--navy);
  }

  .reading-body {
    font-size: 15.5px;
    line-height: 1.8;
    color: var(--text);
    max-width: 680px;
  }

  .reading-body p { margin-bottom: 1.2em; }
  .reading-body h2 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--navy); margin: 1.8em 0 0.6em; }
  .reading-body h3 { font-size: 17px; font-weight: 700; color: var(--navy); margin: 1.4em 0 0.4em; }
  .reading-body a { color: var(--blue); }
  .reading-body img { max-width: 100%; border-radius: 4px; margin: 1.2em 0; box-shadow: 0 2px 12px rgba(0,0,0,0.1); display: block; }
  .reading-body blockquote { border-left: 3px solid var(--maize); padding-left: 16px; color: var(--muted); margin: 1.2em 0; font-style: italic; }
  .reading-body ul, .reading-body ol { padding-left: 1.4em; margin-bottom: 1.2em; }
  .reading-body li { margin-bottom: 0.3em; }
  .reading-body hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

  /* ── EDITOR VIEW ── */
  .editor-view {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-view.visible { display: flex; }

  .editor-toolbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
    background: #fafafa;
  }

  .tb-btn {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 8px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'Source Sans 3', sans-serif;
    color: var(--text);
    line-height: 1.4;
  }
  .tb-btn:hover { border-color: var(--navy); background: #f0f4f9; }
  .tb-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .tb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

  .tb-label { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

  .editor-title-wrap {
    padding: 20px 28px 0;
    flex-shrink: 0;
  }

  .editor-title {
    width: 100%;
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
    border: none;
    outline: none;
    background: transparent;
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 0;
    transition: border-color 0.15s;
  }
  .editor-title:focus { border-bottom-color: var(--navy); }
  .editor-title::placeholder { color: #ccc; }

  .editor-date-wrap {
    padding: 10px 28px 0;
    flex-shrink: 0;
  }

  .editor-date {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 13px;
    font-family: 'Source Sans 3', sans-serif;
    color: var(--text);
    outline: none;
    background: var(--white);
  }
  .editor-date:focus { border-color: var(--navy); }

  .editor-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 28px 28px;
  }

  /* The contenteditable area */
  .editor-content {
    min-height: 100%;
    outline: none;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }

  .editor-content:empty::before {
    content: "Write your post here… Use the toolbar above to add formatting, links, and images.";
    color: #ccc;
    pointer-events: none;
  }

  .editor-content p { margin-bottom: 1em; }
  .editor-content h2 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--navy); margin: 1.6em 0 0.4em; }
  .editor-content h3 { font-size: 17px; font-weight: 700; color: var(--navy); margin: 1.2em 0 0.3em; }
  .editor-content a { color: var(--blue); }
  .editor-content img { max-width: 100%; border-radius: 4px; margin: 1em 0; box-shadow: 0 2px 12px rgba(0,0,0,0.1); display: block; }
  .editor-content blockquote { border-left: 3px solid var(--maize); padding-left: 16px; color: var(--muted); margin: 1em 0; font-style: italic; }
  .editor-content ul, .editor-content ol { padding-left: 1.4em; margin-bottom: 1em; }
  .editor-content li { margin-bottom: 0.3em; }

  .editor-footer {
    padding: 12px 28px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
    background: #fafafa;
  }

  .btn-save {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 8px 20px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    font-family: 'Source Sans 3', sans-serif;
  }
  .btn-save:hover { background: #003870; }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    color: var(--muted);
  }
  .btn-cancel:hover { border-color: var(--muted); color: var(--text); }

  .save-status {
    font-size: 12.5px;
    color: var(--muted);
    margin-left: 4px;
  }

  /* ── WELCOME STATE ── */
  .welcome-view {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }

  .welcome-view h2 {
    font-family: 'Playfair Display', serif;
    color: var(--navy);
    font-size: 24px;
    margin-bottom: 4px;
  }

  .welcome-view p { font-size: 14.5px; max-width: 360px; }

  /* ── LINK MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 500;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 6px;
    padding: 28px 32px;
    width: 420px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  }

  .modal h3 {
    font-family: 'Playfair Display', serif;
    color: var(--navy);
    font-size: 18px;
    margin-bottom: 18px;
  }

  .modal label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
  }

  .modal input[type="text"], .modal input[type="url"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 14px;
    font-family: 'Source Sans 3', sans-serif;
    outline: none;
    margin-bottom: 16px;
  }
  .modal input:focus { border-color: var(--navy); }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .blog-layout { flex-direction: column; height: auto; }
    .sidebar { width: 100%; height: 220px; }
    .reading-view, .editor-view { padding: 24px 20px; }
  }

  /* ── IMAGE UPLOAD BUTTON ── */
  #imageUpload { display: none; }

  /* ── AUTH ── */
  .btn-lock {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    transition: all 0.15s;
    margin-left: 16px;
  }
  .btn-lock:hover { border-color: var(--maize); color: var(--maize); }
  .btn-lock.unlocked { color: #6ee7b7; border-color: rgba(110,231,183,0.4); }

  .auth-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 600;
    align-items: center;
    justify-content: center;
  }
  .auth-modal-overlay.open { display: flex; }

  .auth-modal {
    background: var(--white);
    border-radius: 8px;
    padding: 32px 36px;
    width: 360px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
  }
  .auth-modal h3 {
    font-family: 'Playfair Display', serif;
    color: var(--navy);
    font-size: 20px;
    margin-bottom: 6px;
  }
  .auth-modal p {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .auth-modal input[type="password"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: 'Source Sans 3', sans-serif;
    outline: none;
    margin-bottom: 8px;
  }
  .auth-modal input:focus { border-color: var(--navy); }
  .auth-error {
    font-size: 12.5px;
    color: var(--red);
    min-height: 18px;
    margin-bottom: 12px;
  }
  .auth-actions { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="site-name">Parth Vaishnav</a>
  <div class="header-links">
    <a href="index.html">Home</a>
    <a href="https://parthtv.github.io/cv" target="_blank">CV</a>
    <button class="btn-lock" id="lockBtn" onclick="toggleAuth()">🔒 Admin</button>
  </div>
</header>

<div class="blog-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Posts</span>
      <button class="btn-new admin-only" id="btnNewPost" onclick="newPost()" style="display:none">+ New post</button>
    </div>
    <div class="post-list" id="postList"></div>
  </aside>

  <!-- MAIN PANEL -->
  <main class="main-panel">

    <!-- Welcome state -->
    <div class="welcome-view" id="welcomeView">
      <h2>Welcome to your blog</h2>
      <p>Select a post from the sidebar to read it.</p>
    </div>

    <!-- Reading view -->
    <div class="reading-view" id="readingView">
      <div class="reading-meta">
        <span class="reading-date" id="readingDate"></span>
        <div class="reading-actions admin-only" id="adminReadingActions" style="display:none">
          <button class="btn-action" onclick="editCurrent()">Edit</button>
          <button class="btn-action danger" onclick="deleteCurrent()">Delete</button>
        </div>
      </div>
      <div class="reading-title" id="readingTitle"></div>
      <div class="reading-body" id="readingBody"></div>
    </div>

    <!-- Editor view -->
    <div class="editor-view" id="editorView">
      <div class="editor-toolbar">
        <span class="tb-label">Format</span>
        <button class="tb-btn" onclick="fmt('bold')" title="Bold"><b>B</b></button>
        <button class="tb-btn" onclick="fmt('italic')" title="Italic"><i>I</i></button>
        <button class="tb-btn" onclick="fmt('underline')" title="Underline"><u>U</u></button>
        <div class="tb-sep"></div>
        <span class="tb-label">Headings</span>
        <button class="tb-btn" onclick="fmtBlock('h2')">H2</button>
        <button class="tb-btn" onclick="fmtBlock('h3')">H3</button>
        <button class="tb-btn" onclick="fmtBlock('p')">¶</button>
        <div class="tb-sep"></div>
        <span class="tb-label">Lists</span>
        <button class="tb-btn" onclick="fmt('insertUnorderedList')">• List</button>
        <button class="tb-btn" onclick="fmt('insertOrderedList')">1. List</button>
        <div class="tb-sep"></div>
        <span class="tb-label">Insert</span>
        <button class="tb-btn" onclick="openLinkModal()">🔗 Link</button>
        <button class="tb-btn" onclick="document.getElementById('imageUpload').click()">🖼 Image</button>
        <button class="tb-btn" onclick="fmtBlock('blockquote')">❝ Quote</button>
        <button class="tb-btn" onclick="fmt('insertHorizontalRule')">— Rule</button>
        <input type="file" id="imageUpload" accept="image/*" onchange="insertImage(this)">
      </div>

      <div class="editor-title-wrap">
        <input class="editor-title" id="editorTitle" type="text" placeholder="Post title…">
      </div>

      <div class="editor-date-wrap">
        <input class="editor-date" id="editorDate" type="date">
      </div>

      <div class="editor-body">
        <div class="editor-content" id="editorContent" contenteditable="true"></div>
      </div>

      <div class="editor-footer">
        <button class="btn-save" onclick="savePost()">Save post</button>
        <button class="btn-cancel" onclick="cancelEdit()">Cancel</button>
        <span class="save-status" id="saveStatus"></span>
      </div>
    </div>

  </main>
</div>

<!-- Link modal -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h3>Insert link</h3>
    <label>Link text</label>
    <input type="text" id="linkText" placeholder="e.g. Nature Energy paper">
    <label>URL</label>
    <input type="url" id="linkUrl" placeholder="https://…">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeLinkModal()">Cancel</button>
      <button class="btn-save" onclick="insertLink()">Insert</button>
    </div>
  </div>
</div>

<!-- Auth modal -->
<div class="auth-modal-overlay" id="authModal">
  <div class="auth-modal">
    <h3>Admin login</h3>
    <p>Enter your password to create or edit posts.</p>
    <input type="password" id="authPassword" placeholder="Password" onkeydown="if(event.key==='Enter')submitAuth()">
    <div class="auth-error" id="authError"></div>
    <div class="auth-actions">
      <button class="btn-cancel" onclick="closeAuthModal()">Cancel</button>
      <button class="btn-save" onclick="submitAuth()">Unlock</button>
    </div>
  </div>
</div>

<script>
// ── STORAGE HELPERS ──────────────────────────────────────────────────────────
const STORAGE_KEY = 'parth_blog_posts';

function loadPosts() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function savePosts(posts) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
}

// ── STATE ────────────────────────────────────────────────────────────────────
let posts = loadPosts();
let currentId = null;
let isEditing = false;
let savedSelection = null;
let isAuthed = false;

// ── AUTH ─────────────────────────────────────────────────────────────────────
// Password hash (SHA-256 of your chosen password).
// Default password is: BlogAdmin2025!
// To change it, replace this hash with: await crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourpassword'))
// then convert the ArrayBuffer to hex.
const PASSWORD_HASH = 'ebde91ce8285c7e3ff9478dddbe493f26c8c5ec9d5be697ffff7790fe940a4fc';

async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function toggleAuth() {
  if (isAuthed) {
    // Lock
    isAuthed = false;
    applyAuthState();
    // If editor is open, close it
    if (document.getElementById('editorView').classList.contains('visible')) {
      cancelEdit();
    }
  } else {
    openAuthModal();
  }
}

function openAuthModal() {
  document.getElementById('authPassword').value = '';
  document.getElementById('authError').textContent = '';
  document.getElementById('authModal').classList.add('open');
  setTimeout(() => document.getElementById('authPassword').focus(), 50);
}

function closeAuthModal() {
  document.getElementById('authModal').classList.remove('open');
}

async function submitAuth() {
  const pw = document.getElementById('authPassword').value;
  const hash = await hashPassword(pw);
  if (hash === PASSWORD_HASH) {
    isAuthed = true;
    closeAuthModal();
    applyAuthState();
  } else {
    document.getElementById('authError').textContent = 'Incorrect password.';
    document.getElementById('authPassword').value = '';
    document.getElementById('authPassword').focus();
  }
}

function applyAuthState() {
  const btn = document.getElementById('lockBtn');
  const newPostBtn = document.getElementById('btnNewPost');
  const adminActions = document.getElementById('adminReadingActions');

  if (isAuthed) {
    btn.textContent = '🔓 Admin';
    btn.classList.add('unlocked');
    newPostBtn.style.display = '';
    if (currentId) adminActions.style.display = '';
  } else {
    btn.textContent = '🔒 Admin';
    btn.classList.remove('unlocked');
    newPostBtn.style.display = 'none';
    adminActions.style.display = 'none';
  }
}

document.getElementById('authModal').addEventListener('click', function(e) {
  if (e.target === this) closeAuthModal();
});

// ── RENDER SIDEBAR (year/month groups) ───────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('postList');
  if (posts.length === 0) {
    list.innerHTML = `<div class="empty-state">No posts yet.</div>`;
    return;
  }

  const sorted = [...posts].sort((a, b) => new Date(b.date) - new Date(a.date));

  // Group by year, then month
  const byYear = {};
  sorted.forEach(p => {
    const [y, m] = (p.date || '0000-00').split('-');
    if (!byYear[y]) byYear[y] = {};
    if (!byYear[y][m]) byYear[y][m] = [];
    byYear[y][m].push(p);
  });

  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  let html = '';
  const years = Object.keys(byYear).sort((a,b) => b - a);

  years.forEach((yr, yi) => {
    // Collapse all year groups except the most recent (yi===0)
    const yCollapsed = yi > 0 ? ' collapsed' : '';
    html += `<div class="year-group${yCollapsed}" id="yg-${yr}">`;
    html += `<div class="year-heading" onclick="toggleYearGroup('${yr}')">
               <span>${yr}</span>
               <span class="year-toggle">▼</span>
             </div>`;
    html += `<div class="year-body">`;

    const months = Object.keys(byYear[yr]).sort((a,b) => b - a);
    months.forEach((mo, mi) => {
      const monthName = MONTHS[(+mo - 1)] || mo;
      // Collapse all month groups except the most recent in the most recent year
      const mCollapsed = (yi === 0 && mi === 0) ? '' : ' collapsed';
      html += `<div class="month-group${mCollapsed}" id="mg-${yr}-${mo}">`;
      html += `<div class="month-heading" onclick="toggleMonthGroup('${yr}','${mo}')">
                 <span>${monthName}</span>
                 <span class="month-toggle">▼</span>
               </div>`;
      html += `<div class="month-body">`;

      byYear[yr][mo].forEach(p => {
        const active = p.id === currentId ? ' active' : '';
        html += `<div class="post-item${active}" onclick="openPost('${p.id}')">
          <div class="post-item-title">${escHtml(p.title || 'Untitled')}</div>
        </div>`;
      });

      html += `</div></div>`; // month-body, month-group
    });

    html += `</div></div>`; // year-body, year-group
  });

  list.innerHTML = html;
}

function toggleYearGroup(yr) {
  document.getElementById('yg-' + yr).classList.toggle('collapsed');
}

function toggleMonthGroup(yr, mo) {
  document.getElementById('mg-' + yr + '-' + mo).classList.toggle('collapsed');
}

// ── OPEN / READ POST ─────────────────────────────────────────────────────────
function openPost(id) {
  currentId = id;
  isEditing = false;
  const post = posts.find(p => p.id === id);
  if (!post) return;

  document.getElementById('welcomeView').style.display = 'none';
  document.getElementById('editorView').classList.remove('visible');
  document.getElementById('readingView').classList.add('visible');

  document.getElementById('readingDate').textContent = formatDate(post.date);
  document.getElementById('readingTitle').textContent = post.title || 'Untitled';
  document.getElementById('readingBody').innerHTML = post.body;

  // Show admin actions only if authed
  document.getElementById('adminReadingActions').style.display = isAuthed ? '' : 'none';

  renderSidebar();
}

// ── NEW POST ─────────────────────────────────────────────────────────────────
function newPost() {
  if (!isAuthed) return;
  currentId = null;
  isEditing = true;

  document.getElementById('welcomeView').style.display = 'none';
  document.getElementById('readingView').classList.remove('visible');
  document.getElementById('editorView').classList.add('visible');

  document.getElementById('editorTitle').value = '';
  document.getElementById('editorDate').value = todayISO();
  document.getElementById('editorContent').innerHTML = '';
  document.getElementById('saveStatus').textContent = '';

  renderSidebar();
  setTimeout(() => document.getElementById('editorTitle').focus(), 50);
}

// ── EDIT CURRENT POST ────────────────────────────────────────────────────────
function editCurrent() {
  if (!isAuthed || !currentId) return;
  const post = posts.find(p => p.id === currentId);
  if (!post) return;
  isEditing = true;

  document.getElementById('readingView').classList.remove('visible');
  document.getElementById('editorView').classList.add('visible');

  document.getElementById('editorTitle').value = post.title || '';
  document.getElementById('editorDate').value = post.date || todayISO();
  document.getElementById('editorContent').innerHTML = post.body || '';
  document.getElementById('saveStatus').textContent = '';
}

// ── SAVE POST ────────────────────────────────────────────────────────────────
function savePost() {
  if (!isAuthed) return;
  const title = document.getElementById('editorTitle').value.trim() || 'Untitled';
  const date  = document.getElementById('editorDate').value || todayISO();
  const body  = document.getElementById('editorContent').innerHTML;

  if (currentId) {
    const idx = posts.findIndex(p => p.id === currentId);
    if (idx !== -1) { posts[idx] = { ...posts[idx], title, date, body }; }
  } else {
    const id = 'post_' + Date.now();
    posts.push({ id, title, date, body });
    currentId = id;
  }

  savePosts(posts);
  renderSidebar();

  const status = document.getElementById('saveStatus');
  status.textContent = '✓ Saved';
  setTimeout(() => status.textContent = '', 2500);

  openPost(currentId);
}

// ── CANCEL EDIT ──────────────────────────────────────────────────────────────
function cancelEdit() {
  if (currentId) {
    openPost(currentId);
  } else {
    document.getElementById('editorView').classList.remove('visible');
    document.getElementById('welcomeView').style.display = '';
    currentId = null;
    renderSidebar();
  }
}

// ── DELETE POST ──────────────────────────────────────────────────────────────
function deleteCurrent() {
  if (!isAuthed || !currentId) return;
  const post = posts.find(p => p.id === currentId);
  if (!confirm(`Delete "${post?.title || 'this post'}"? This cannot be undone.`)) return;
  posts = posts.filter(p => p.id !== currentId);
  savePosts(posts);
  currentId = null;

  document.getElementById('readingView').classList.remove('visible');

  // Open next most recent post if any
  if (posts.length > 0) {
    const next = [...posts].sort((a,b) => new Date(b.date)-new Date(a.date))[0];
    openPost(next.id);
  } else {
    document.getElementById('welcomeView').style.display = '';
    renderSidebar();
  }
}

// ── FORMATTING ───────────────────────────────────────────────────────────────
function fmt(cmd, val) {
  document.getElementById('editorContent').focus();
  document.execCommand(cmd, false, val || null);
}

function fmtBlock(tag) {
  document.getElementById('editorContent').focus();
  document.execCommand('formatBlock', false, tag);
}

// ── LINK MODAL ───────────────────────────────────────────────────────────────
function openLinkModal() {
  const sel = window.getSelection();
  if (sel.rangeCount) savedSelection = sel.getRangeAt(0).cloneRange();
  const selectedText = sel.toString();
  document.getElementById('linkText').value = selectedText;
  document.getElementById('linkUrl').value = '';
  document.getElementById('linkModal').classList.add('open');
  setTimeout(() => document.getElementById(selectedText ? 'linkUrl' : 'linkText').focus(), 50);
}

function closeLinkModal() {
  document.getElementById('linkModal').classList.remove('open');
  savedSelection = null;
}

function insertLink() {
  const text = document.getElementById('linkText').value.trim();
  const url  = document.getElementById('linkUrl').value.trim();
  if (!url) { closeLinkModal(); return; }

  const editor = document.getElementById('editorContent');
  editor.focus();

  if (savedSelection) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
  }

  const a = `<a href="${escAttr(url)}" target="_blank">${escHtml(text || url)}</a>`;
  document.execCommand('insertHTML', false, a);
  closeLinkModal();
}

document.getElementById('linkModal').addEventListener('click', function(e) {
  if (e.target === this) closeLinkModal();
});

// ── IMAGE UPLOAD ─────────────────────────────────────────────────────────────
function insertImage(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = `<img src="${e.target.result}" alt="${escAttr(file.name.replace(/\.[^.]+$/, ''))}">`;
    document.getElementById('editorContent').focus();
    document.execCommand('insertHTML', false, img);
  };
  reader.readAsDataURL(file);
  input.value = '';
}

// ── UTILS ────────────────────────────────────────────────────────────────────
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(iso) {
  if (!iso) return '';
  try {
    const [y, m, d] = iso.split('-');
    return new Date(+y, +m - 1, +d).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return iso; }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && isEditing) {
    e.preventDefault();
    savePost();
  }
  if (e.key === 'Escape') {
    if (document.getElementById('linkModal').classList.contains('open')) closeLinkModal();
    if (document.getElementById('authModal').classList.contains('open')) closeAuthModal();
  }
  if (e.key === 'Enter' && document.getElementById('authModal').classList.contains('open')) {
    submitAuth();
  }
});

// ── INIT ─────────────────────────────────────────────────────────────────────
renderSidebar();
// Auto-open the most recent post if any exist
if (posts.length > 0) {
  const first = [...posts].sort((a,b) => new Date(b.date) - new Date(a.date))[0];
  openPost(first.id);
}
</script>
