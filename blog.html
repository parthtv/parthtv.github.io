<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
</head>
<body>
    <h1>My Blog</h1>
    <div id="posts"></div>
    <form id="blogForm">
        <textarea id="blogContent" placeholder="Write your post here..."></textarea>
        <button type="submit">Save Post</button>
    </form>
    <script>
        async function fetchPosts() {
            try {
                const response = await axios.get('https://api.github.com/repos/parthtv/parthtv.github.io/contents/blog.html');
                const content = atob(response.data.content);
                document.getElementById('posts').innerHTML = content;
            } catch (error) {
                console.error('Error fetching posts:', error);
            }
        }

        async function savePost(content) {
            const base64Content = btoa(content);
            const sha = 'bb93b85aa08570164101d92e72913342f4834fe6';
            try {
                const response = await axios.put('https://api.github.com/repos/parthtv/parthtv.github.io/contents/blog.html', {
                    message: 'Update blog.html',
                    content: base64Content,
                    sha: sha
                }, {
                    headers: {
                        'Authorization': 'token YOUR_GITHUB_PERSONAL_ACCESS_TOKEN'
                    }
                });
                alert('Post saved successfully!');
                fetchPosts();
            } catch (error) {
                console.error('Error saving post:', error);
            }
        }

        document.getElementById('blogForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const content = document.getElementById('blogContent').value;
            savePost(content);
        });

        fetchPosts();
    </script>
</body>
</html>
